{% extends "base.html" %}

{% block title %}Log in | QRShield{% endblock %}

{% block content %}
        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">Welcome back</p>
                <h2>Log in to QRShield</h2>
                <p class="auth-lede">Log in to see your past scans and build up a history.</p>

                <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <label class="field">
                    
                        <span>Username or email</span>
                        <input type="text" name="identifier" autocomplete="username" required>
                    </label>

                    <label class="field">
                        <span>Password</span>
                        <input type="password" name="password" autocomplete="current-password" required>
                    </label>

                    <button class="scan-button" type="submit">
                        <span>Log in</span>
                        <span class="arrow">→</span>
                    </button>
                </form>

                <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
            </div>
        </section>
{% endblock %}
